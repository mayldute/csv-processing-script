[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "csv-report-generator"
version = "0.1.0"
description = "Extensible CLI application for generating analytical reports from CSV files."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tabulate>=0.9,<1",
]


[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]


[tool.hatch.build.targets.wheel]
packages = ["src/csv_report_generator"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
xfail_strict = true
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]


[tool.coverage.run]
source = ["csv_report_generator"]
branch = true


[tool.coverage.report]
show_missing = true
skip_covered = true


[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "pytest-mock>=3.15.1",
]
